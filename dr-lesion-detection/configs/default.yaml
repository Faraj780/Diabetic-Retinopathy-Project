# Settings for data preparation. Command-line flags override the paths.
# Paths can be absolute (e.g. /mnt/hdd2/faraj/...) or relative to the project folder.

paths:
  annotations: data/raw/BBoxAnnotations   # folder of annotation CSVs (searched recursively)
  images: data/raw/train                  # Kaggle training images
  grades_csv: data/raw/trainLabels.csv    # Kaggle image-level DR grades (image,level); null to skip
  output: data/processed                  # everything prepare_data.py writes goes here

# Class order decides the YOLO class ids (0, 1, 2, ...). Fix it before your first
# training run and don't reorder afterwards, or old runs stop being comparable.
classes:
  - Retinal Microaneurysm
  - Retinal Dot Haemorrhage
  - Retinal Blot Haemorrhage
  - Hard Retinal Exudate (Retinal Lipid Deposit)
  - Soft Retinal Exudate (Cotton wool spot)
  - New Vessels at Disc (NVD)
  - New Vessels Elsewhere (NVE)

csv:
  # Rows whose annotation_type is one of these are treated as boxes.
  rectangle_types: [rectangle]
  # Map our names (left) to the column names in your CSVs (right).
  columns:
    image_name: image_name
    annotation_type: annotation_type
    label: label
    left: left_coordinate
    top: top_coordinate
    width: width
    height: height
    scale_x: image_scale_x
    scale_y: image_scale_y

cleaning:
  min_box_size_px: 1.0               # boxes thinner than this (after clipping) are dropped
  keep_images_without_boxes: false   # true keeps them as negative examples (empty label files)

split:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  seed: 0
  restarts: 20                       # more restarts = better balance, slightly slower
  group_by_patient: true             # keep a patient's left and right eye in the same split
  # How to read patient id and eye from a file name such as "10_left.jpeg".
  patient_regex: '^(?P<patient>\d+)_(?P<eye>left|right)$'

export:
  # How images appear in the YOLO folders: symlink (no extra disk space), copy, or hardlink.
  # Symlinks only work on the machine where you ran prepare_data.py, so run it on the server.
  link_mode: symlink
